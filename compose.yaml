services:
  server:
    build: .
    ports:
      - '8000:8000'
    volumes:
      # The source is bind-mounted, so edits reach the dev server without any sync step.
      - .:/usr/src/app
      # node_modules gets its own volume: the container needs Linux builds of the packages,
      # not the host's. Compose keeps this volume across rebuilds, so it can fall behind
      # package-lock.json — the command below catches that.
      - /usr/src/app/node_modules
    # Reinstall only when package-lock.json differs from the copy saved at the last install
    # (node_modules/.installed-lock, also written by the Dockerfile), then start Vite.
    command: >
      sh -c "{ cmp -s package-lock.json node_modules/.installed-lock ||
      { echo 'package-lock.json changed: reinstalling dependencies' && npm ci --no-audit --no-fund && cp package-lock.json node_modules/.installed-lock; }; } &&
      exec npm run dev"
